[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-phi-scan"
version = "0.1.0"
description = "Two-layer DICOM PHI detection: header tag analysis and OCR pixel inspection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Elijah Rockers", email = "elijah.rockers@gmail.com"}]

dependencies = [
    "pydicom>=2.4.0",
    "Pillow>=10.0.0",
    "easyocr>=1.7",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
# Optional codecs. Needed to DECODE compressed pixel data (e.g. a JPEG cine loop)
# and to use the lossless/lossy --compress options during banner redaction. RLE
# Lossless (--compress rle) and uncompressed output (--compress none) need none of
# these — they ship with pydicom.
codecs = [
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg",   # JPEG baseline/extended/lossless (decode + --compress jpeg)
    "pylibjpeg-openjpeg",  # JPEG 2000 (--compress jpeg2000)
    "pyjpegls",            # JPEG-LS (--compress jpeg-ls)
]
# Optional. Needed only for --view (preview a file in a GUI window or export a PDF).
viz = [
    "matplotlib>=3.7",
]

[project.scripts]
dicom-phi-scan = "dicom_phi_scan.cli:main"

[tool.setuptools.packages.find]
include = ["dicom_phi_scan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
